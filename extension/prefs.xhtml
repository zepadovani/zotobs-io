<vbox id="zotobs-prefs" onload="ZotobsPrefs.init()">
  <groupbox>
    <label><html:h2>zotobs — exportar anotações</html:h2></label>
    <description>
      Pasta padrão onde o comando “Exportar anotações (pasta padrão)” cria, para cada PDF,
      uma pasta com o mesmo caminho/nome que o ZotMoov usa para o arquivo
      (&lt;pasta&gt;/Autor/Nome do PDF/Nome do PDF.md).
    </description>
    <hbox align="center">
      <html:input id="zotobs-export-dir" type="text" preference="extensions.zotobs.export_dir"
                  style="flex: 1" placeholder="/caminho/para/notas-de-leitura"/>
      <button id="zotobs-choose-dir" label="Escolher…"/>
    </hbox>
    <checkbox id="zotobs-mirror" preference="extensions.zotobs.mirror_zotmoov"
              label="Repetir a subpasta do ZotMoov (ex.: Autor/) dentro da pasta padrão"/>
    <checkbox id="zotobs-images" preference="extensions.zotobs.export_images"
              label="Salvar imagens das anotações de área (pasta &lt;nome&gt;_img)"/>
  </groupbox>
</vbox>
