<vbox id="zotobs-prefs" onload="ZotobsPrefs.init()">
  <groupbox>
    <label><html:h2>zotobs — exportar anotações</html:h2></label>
    <description>
      Pasta padrão onde o comando “Exportar anotações (pasta padrão)” cria, para cada PDF,
      uma pasta com o nome do PDF (o mesmo que o ZotMoov dá ao arquivo):
      &lt;pasta&gt;/Nome do PDF/Nome do PDF.md, mais Nome do PDF_img/.
    </description>
    <hbox align="center">
      <html:input id="zotobs-export-dir" type="text" preference="extensions.zotobs.export_dir"
                  style="flex: 1" placeholder="/caminho/para/notas-de-leitura"/>
      <button id="zotobs-choose-dir" label="Escolher…"/>
    </hbox>
    <checkbox id="zotobs-usecli" preference="extensions.zotobs.use_cli"
              label="Usar o CLI zotobs na exportação (desenhos sobre imagens, texto coberto, recortes)"/>
    <html:input id="zotobs-cli-path" type="text" preference="extensions.zotobs.cli_path"
                placeholder="caminho do zotobs (vazio = ~/.local/bin/zotobs ou ~/repositorios/zotobs-io/bin/zotobs)"/>
    <checkbox id="zotobs-images" preference="extensions.zotobs.export_images"
              label="Salvar imagens das anotações de área (pasta &lt;nome&gt;_img)"/>
  </groupbox>
</vbox>
